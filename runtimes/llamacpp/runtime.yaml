name: llamacpp
servers:
  openai:
    protocol: http
    base-path: /v1
  systemone:
    protocol: http
    base-path: /v1/systemone
environment:
  - PATH=$PATH:$SNAP_COMPONENTS/llamacpp/bin
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp/lib
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/llamacpp/usr/lib/$ARCH_TRIPLET
components:
  - llamacpp
