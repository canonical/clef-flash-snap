name: clef-flash-q4-k-m-5gb
alias: Clef Flash Q4_K_M 5GB
description: Cloudflare's Clef-Flash 9B multimodal decision model in Q4_K_M GGUF format.
model-card-url: https://huggingface.co/Cloudflare/clef-flash
format: GGUF
quantization: Q4_K_M
disk-size: 6782M
capabilities:
  - text
  - vision
components:
  - model-clef-flash-1-of-2
  - model-clef-flash-2-of-2
  - mmproj-clef-flash
environment:
  - MODEL_PARTS_DIR=/tmp/clef-flash-parts
  - MODEL_FILE=$MODEL_PARTS_DIR/Clef-Flash-Q4_K_M-00001-of-00002.gguf
  - MMPROJ_FILE=$SNAP_COMPONENTS/mmproj-clef-flash/mmproj-Clef-Flash-Q8_0.gguf
layout:
  $MODEL_PARTS_DIR/Clef-Flash-Q4_K_M-00001-of-00002.gguf:
    symlink: $SNAP_COMPONENTS/model-clef-flash-1-of-2/Clef-Flash-Q4_K_M-00001-of-00002.gguf
  $MODEL_PARTS_DIR/Clef-Flash-Q4_K_M-00002-of-00002.gguf:
    symlink: $SNAP_COMPONENTS/model-clef-flash-2-of-2/Clef-Flash-Q4_K_M-00002-of-00002.gguf
